[project]
name = "archival-packager"
version = "0.1.6"
description = "SIP/AIP creator for macOS and Windows from a single codebase"
# Flet が .app / .exe に同梱する Python に合わせて固定する。
# 開発環境だけ新しいと「開発機では通るが配布物では落ちる」（およびその逆）が起きる。
# 実測: Flet 0.86.2 は python-build-standalone の 3.12.13 を同梱する。
requires-python = ">=3.12,<3.13"
dependencies = [
    # **`[all]` にしない。** `[all]` は flet-cli（ビルド用）と flet-web を引き込み、
    # その依存（cookiecutter / fastapi / uvicorn / chardet / text-unidecode …）が
    # 丸ごと配布物に入る。実行には要らないうえ、chardet は LGPL、
    # text-unidecode は Artistic/GPL で、NOTICE に書いていない表示義務が増える。
    # 実行に要るのは desktop だけ。ビルド用の flet-cli は dev グループに置く。
    "flet[desktop]==0.86.2",
    # BagIt は自前実装しない。米国議会図書館のリファレンス実装を使う。
    # これが Python を移植先に選んだ最大の理由。
    "bagit>=1.8.1",
    # METS/PREMIS の生成と XSD 検証。標準 ElementTree では検証ができない。
    "lxml>=5.3.0",
    # PII 走査で PDF からテキストを抽出する（macOS 専用の PDFKit の代替）。
    "pypdf>=5.1.0",
    "pillow>=11.0",
]

# コマンドライン入口。**配布物（.app / MSIX）には引数が届かない**ので、
# これはソースから動かす利用者のためのもの（src/archival_packager/cli.py の注を参照）。
# 依存は増やさない（argparse は標準ライブラリ）。
[project.scripts]
archival-packager = "archival_packager.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    # `uv run flet build` に要る。配布物に入れたくないので実行時依存にはしない。
    "flet-cli==0.86.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archival_packager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # 自分のコードの警告は見逃したくないので既定はエラー。
    "error",
    # bagit 1.8.1 が codecs.open() を使っており 1 実行で数百件出る。
    # 埋もれると本当の警告に気づけないので、これだけ黙らせる。
    # bagit 側が修正されたらこの行を消して確認する。
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning:bagit",
]

[tool.ruff]
# 既存の書き方に合わせる（実測: 88 桁で 245 件、100 桁で 29 件、110 桁で 5 件）。
# 本文は概ね 100 桁で書かれているが、日本語コメントが少しはみ出す行がある。
# **今ある行を折り返すために 15 ファイルを触ると、変更の差分が読めなくなる。**
# 極端な行だけを捕まえる目的で 110 にし、はみ出した 5 行だけ直した。
line-length = 110

[tool.ruff.lint]
# E/F: 素の誤り。I: import 順。UP: 古い書き方。B: 壊れやすい書き方。
# DTZ: tz を持たない datetime。2026-09-12 に有効化した（14 件を整理）。
# **これは見た目の問題ではない。** Windows で `spreadsheets._iso` が
# OSError で落ちた事故が、まさにこの型だった（tz 無しの値を astimezone に
# 渡すと 1970-01-01 前後で失敗する）。この規則があれば気づけていた。
# 意図して tz 無しにしている試験は 2 か所あり、`# noqa: DTZ00x` を付けてある。
select = ["E", "F", "I", "UP", "B", "DTZ"]
