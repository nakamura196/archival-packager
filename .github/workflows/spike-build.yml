# Flet 実行可能性検証（spike/README.md の項目 3）
#
# Flutter は macOS から Windows デスクトップをクロスビルドできないため、
# Windows 版が作れるかは CI でしか確かめられない。
#
# この workflow で確かめること:
#   - flet build windows が通るか
#   - 同梱バイナリ(sf.exe)を known_locations() が想定する場所に置けるか
#   - その場所から sf.exe が実際に起動するか
#
# 確かめられないこと（正直に書いておく）:
#   GUI アプリを実際に起動しての解決確認。CI にデスクトップセッションが無いため、
#   バイナリの配置と単体起動までを確認し、解決ロジック自体は
#   main.py の known_locations() がその配置を指していることで担保する。
#
# 検証が終わったらこの workflow は本番用に差し替える（署名・公証を足す）。

name: spike build

on:
  workflow_dispatch:
  push:
    paths:
      - "spike/**"
      - "binaries/**"
      - ".github/workflows/spike-build.yml"

permissions:
  contents: read

env:
  # 同梱する siegfried のバージョン。mac / Windows で同一版に揃える
  # （フォーマット識別結果が OS でぶれると保存パッケージの再現性が崩れるため）。
  SIEGFRIED_VERSION: "1-11-6"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest は現在 windows-2025-vs2026（Visual Studio 2026）。
          #
          # Flet 0.28.3 が要求する Flutter 3.29.2 ではこの世代を認識できず、
          # 古い「Visual Studio 16 2019」を探して
          #   could not find any instance of Visual Studio.
          #   Unable to generate build files
          # で落ちていた。
          #
          # Flet は要求 Flutter のメジャー・マイナーが完全一致しないと
          # システムの Flutter を使わず自前で該当版を落とす仕様
          # （flutter_base.py: flutter_version.major == required.major
          #   and flutter_version.minor == required.minor）。
          # つまり Flutter だけ新しくすることはできず、Flet ごと上げるしかない。
          #
          # Flet 0.86.2 は Flutter 3.44.7 を要求する。これで VS 2026 に対応する
          # 想定のため、runner の pin を外して windows-latest のまま通す。
          - os: windows-latest
            target: windows
            sf_asset: win64
          - os: macos-latest
            target: macos
            sf_asset: mac64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: true

      # Flutter は別途インストールしない。Flet が自前で取得する（0.86.2 は Flutter 3.44.7 を要求）。
      # subosito/flutter-action 等で PATH に flutter を置くと、flet の cleanup_path が
      # そのディレクトリを丸ごと除去し、同居するツール（pod 等）を巻き添えにする。
      # 詳細は spike/README.md の「検証中に判明した落とし穴」。
      - name: Cache Flet's Flutter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.flet
            ~/flutter
          key: flet-flutter-${{ matrix.os }}-${{ hashFiles('uv.lock') }}

      - name: Fetch siegfried
        shell: bash
        run: |
          set -euo pipefail
          osdir="${{ matrix.target }}"
          mkdir -p "binaries/$osdir"
          ver="${SIEGFRIED_VERSION//-/.}"
          curl -fsSL -o sf.zip \
            "https://github.com/richardlehane/siegfried/releases/download/v${ver}/siegfried_${SIEGFRIED_VERSION}_${{ matrix.sf_asset }}.zip"
          unzip -o -j sf.zip -d "binaries/$osdir"
          # 署名 DB。同梱しないと配布先で識別が失敗する（開発機では OS 既定を拾って気づけない）。
          # data zip の中では siegfried/ 配下に入っているので、パターンにディレクトリを含める。
          curl -fsSL -o data.zip \
            "https://github.com/richardlehane/siegfried/releases/download/v${ver}/data_${SIEGFRIED_VERSION}.zip"
          unzip -o -j data.zip '*/default.sig' -d "binaries/$osdir"
          test -f "binaries/$osdir/default.sig"
          chmod +x "binaries/$osdir"/sf* 2>/dev/null || true
          ls -la "binaries/$osdir"

      # flet は PATH から「flutter を含むディレクトリ」を丸ごと除去する。
      # CocoaPods が flutter と同居していると巻き添えで消え、macOS ビルドが
      # "CocoaPods not installed" で落ちる。症状が分かりにくいので事前に確認する。
      - name: Check pod survives flet's PATH cleanup (macOS only)
        if: matrix.target == 'macos'
        run: |
          uv run python - <<'PY'
          import os, shutil, sys
          from flet.utils import cleanup_path
          original = os.environ.get("PATH", "")
          cleaned = cleanup_path(cleanup_path(original, "flutter"), "dart")
          removed = [p for p in original.split(os.pathsep) if p not in cleaned.split(os.pathsep)]
          print("flet が PATH から除去するディレクトリ:", removed)
          pod = shutil.which("pod", path=cleaned)
          print("除去後の PATH での pod:", pod or "NOT_FOUND")
          if pod is None:
              sys.exit("pod が flet の PATH から消えている。"
                       "flutter と同居しないディレクトリへ symlink すること。")
          PY

      # --no-rich-output は Windows で必須。flet CLI の進捗表示(rich)が
      # スピナー文字 U+25CF を出し、Windows コンソール既定の cp1252 では
      # encode できず UnicodeEncodeError でビルドごと落ちる。
      # PYTHONIOENCODING も併せて指定し、他の非ASCII出力でも落ちないようにする。
      - name: Build
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: uv run flet build ${{ matrix.target }} spike --yes --no-rich-output --product "Flet Spike" --bundle-id com.nakamura.fletspike --org com.nakamura

      # 同梱バイナリはバンドル内に置く。app.zip に入れると公証が弾く
      # （spike/README.md「同梱バイナリは app.zip に入れてはいけない」）。
      # 配置先は main.py の known_locations() と一致させること。
      - name: Embed binaries into the build output
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "macos" ]; then
            app=$(find spike/build/macos -maxdepth 1 -name "*.app" | head -1)
            dest="$app/Contents/Resources/bin"
          else
            dest="spike/build/windows/bin"
          fi
          mkdir -p "$dest"
          cp binaries/${{ matrix.target }}/* "$dest/"
          ls -la "$dest"

      - name: Verify the bundled sf actually runs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "macos" ]; then
            app=$(find spike/build/macos -maxdepth 1 -name "*.app" | head -1)
            sf="$app/Contents/Resources/bin/sf"
          else
            sf="spike/build/windows/bin/sf.exe"
          fi
          chmod +x "$sf" 2>/dev/null || true
          "$sf" -sig "$(dirname "$sf")/default.sig" -version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spike-${{ matrix.target }}
          path: spike/build/
          retention-days: 7
