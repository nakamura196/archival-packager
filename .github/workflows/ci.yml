# テストとビルドの検証。
#
# 既定では Linux でテストのみ走らせる。理由はコスト:
#   Linux ×1 / Windows ×2 / macOS ×10（private リポジトリの課金倍率）
# テストは OS 非依存なので Linux で足りる。
#
# ビルドの検証（Windows）は重いので、明示的に要求されたときだけ動かす。
# macOS のビルド・署名・公証は手元の Mac でできるので CI では行わない。

name: CI

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Windows のビルドも検証する"
        type: boolean
        default: false
      build_macos:
        description: "macOS のビルドも検証する（課金 10 倍。通常は手元で足りる）"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          # 開発と配布物で Python がずれると「開発機では通るが配布物では落ちる」
          # （およびその逆）が起きる。Flet が同梱するのは 3.12。
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --group dev

      - name: pytest
        run: uv run pytest -q

      # 同梱バイナリがある環境でのみ走る統合テストを、実際に走らせる。
      # 無いと siegfried 関連のテストが黙ってスキップされ、
      # 「通った」ように見えて実は検証していない状態になる。
      - name: Fetch siegfried (Linux)
        run: |
          set -euo pipefail
          mkdir -p binaries/macos
          ver=1.11.6
          curl -fsSL -o sf.zip "https://github.com/richardlehane/siegfried/releases/download/v${ver}/siegfried_1-11-6_linux64.zip"
          unzip -o -j sf.zip -d binaries/macos
          curl -fsSL -o data.zip "https://github.com/richardlehane/siegfried/releases/download/v${ver}/data_1-11-6.zip"
          unzip -o -j data.zip '*/default.sig' -d binaries/macos
          chmod +x binaries/macos/sf

      - name: pytest（統合テストを含む）
        run: uv run pytest -q

  build:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.build_windows || inputs.build_macos)
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(
          inputs.build_macos && inputs.build_windows
            && '[{"os":"windows-latest","target":"windows"},{"os":"macos-latest","target":"macos"}]'
          || (inputs.build_macos
            && '[{"os":"macos-latest","target":"macos"}]'
            || '[{"os":"windows-latest","target":"windows"}]') ) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
          enable-cache: true

      # Flet が要求する Flutter のバージョンでキャッシュする。
      # uv.lock のハッシュでキーすると、無関係な依存を 1 つ変えただけで
      # 1.25GB の Flutter SDK を再取得することになる。
      - name: Resolve required Flutter version
        id: flutter
        shell: bash
        run: |
          v=$(uv run python -c "import flet.version; print(flet.version.flutter_version)")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Flet's Flutter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.flet
            ~/flutter
          key: flet-flutter-${{ matrix.os }}-${{ steps.flutter.outputs.version }}

      # 同梱バイナリの取得は、ビルドそのものと同じくらい壊れやすい
      # （配布形態やアーカイブ構造が上流の都合で変わる）。ビルドの前に走らせて、
      # 取得できなくなったことに気づけるようにする。
      - name: Fetch bundled binaries (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: pwsh -File scripts/fetch-binaries.ps1

      - name: Build
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          FLET_CLI_SKIP_FLUTTER_DOCTOR: "true"
        run: >-
          uv run flet build ${{ matrix.target }} . --yes --no-rich-output
          --exclude .venv binaries build tests scripts spike .git .github
          --product "Archival Packager"
          --bundle-id com.nakamura.archivalpackager.x
          --org com.nakamura

      # 同梱バイナリは .exe と同じ階層の bin/ に置く（core/bundled.py の解決順）。
      # ビルド成果物に入れるのは flet ではなくこちらの責任。
      - name: Place bundled binaries next to the executable (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          # Flutter の Windows 出力はバンドル直下に <app>.exe を置く。再帰で拾うと
          # data\ 配下の同梱物まで候補に入るので、直下だけを見る。
          # 1 つに定まらなければ黙って進めず落とす（間違った隣に置いても、
          # 実行時に「同梱していない」と判定されるだけで原因が分かりにくい）。
          $exes = @(Get-ChildItem -Path build\windows -Filter "*.exe" -File)
          if ($exes.Count -ne 1) {
            throw "ビルドした .exe を一意に決められません: $($exes.Name -join ', ')"
          }
          $dest = Join-Path $exes[0].DirectoryName "bin"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force -Path "binaries\windows\*" -Destination $dest
          Write-Host "配置先: $dest"
          Get-ChildItem $dest | Format-Table Name, Length

          # ライセンス表示。同梱している ClamAV は GPL-2.0 なので、表示と
          # ソース入手手段の提示が要る。入れずに配ると条件を満たさない。
          Copy-Item LICENSE, NOTICE -Destination $exes[0].DirectoryName -Force

      - name: Verify the app contains our code and its C extensions
        shell: bash
        run: |
          set -euo pipefail
          root="build/${{ matrix.target }}"
          # ソースが .pyc として入っていること。
          find "$root" -name 'sip_pipeline.pyc' | head -1 | grep -q . \
            || { echo "自前ソースが同梱されていない"; exit 1; }
          # lxml は C 拡張。純 Python の依存と違い、同梱に失敗しうる。
          find "$root" \( -name 'etree*.so' -o -name 'etree*.pyd' \) | head -1 | grep -q . \
            || { echo "lxml の C 拡張が同梱されていない"; exit 1; }
          # Pillow も C 拡張。画像の保存用変換はこれに依存している。
          find "$root" \( -name '_imaging*.so' -o -name '_imaging*.pyd' \) | head -1 | grep -q . \
            || { echo "Pillow の C 拡張が同梱されていない"; exit 1; }
          echo "OK: 自前ソース・lxml・Pillow を確認"

      # 同梱バイナリが実際に起動するかまで見る。DLL や証明書の入れ忘れは
      # 「置いたのに動かない」形で出るので、存在確認だけでは足りない。
      - name: Smoke-test the bundled binaries (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $bin = (Get-ChildItem -Recurse -Path build\windows -Directory -Filter "bin" | Select-Object -First 1).FullName
          & (Join-Path $bin "clamscan.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "同梱 clamscan が起動しません" }
          # sf は -home を渡さないとユーザ領域（%LOCALAPPDATA%\siegfried）の署名 DB を
          # 探しに行き、そこに何も無ければ FATAL で落ちる。アプリは常に -home を渡すので、
          # 確認もアプリと同じ渡し方でなければ、実態と違うものを見ていることになる。
          if (-not (Test-Path (Join-Path $bin "default.sig"))) {
            throw "siegfried の署名 DB (default.sig) が入っていません"
          }
          & (Join-Path $bin "sf.exe") -home $bin -version
          if ($LASTEXITCODE -ne 0) { throw "同梱 sf が起動しません" }
          if (-not (Get-ChildItem -Path (Join-Path $bin "clamav-certs") -Filter "*.crt")) {
            throw "CVD 検証用の証明書が入っていません"
          }
          $root = Split-Path $bin -Parent
          foreach ($doc in @("LICENSE", "NOTICE")) {
            if (-not (Test-Path (Join-Path $root $doc))) { throw "$doc が配布物に入っていません" }
          }

      # Store の掲載に要るスクリーンショットを、runner の画面から撮る。
      #
      # 手元に Windows 機が無いので、撮れるならここで撮るのが一番早い。
      # ただし GitHub の Windows runner に描画できる画面があるかは環境依存で、
      # 真っ黒な画像しか撮れないこともある。**撮れなくてもビルドは止めない。**
      # 撮れたものを見て、使えるかどうかを人が判断する。
      - name: Take screenshots for the Store listing (Windows)
        if: matrix.target == 'windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing

          # Store は 1366x768 以上を求める。runner の既定は狭いことがあるので上げる。
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop
            Write-Host "画面を 1920x1080 にした"
          } catch {
            Write-Host "解像度を変更できなかった: $($_.Exception.Message)"
          }

          $exe = @(Get-ChildItem -Path build\windows -Filter "*.exe" -File)[0].FullName
          Write-Host "起動: $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          # Flet は初回起動に時間がかかる（Python を展開する）。
          Start-Sleep -Seconds 45

          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "画面の大きさ: $($bounds.Width)x$($bounds.Height)"
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("screenshots\01-launch.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()

          # 全部同じ色なら、描画されていない（真っ黒など）。撮れたかの判定に使う。
          $img = [System.Drawing.Image]::FromFile((Resolve-Path "screenshots\01-launch.png"))
          $b = New-Object System.Drawing.Bitmap $img
          $colors = @{}
          for ($x = 0; $x -lt $b.Width; $x += 97) {
            for ($y = 0; $y -lt $b.Height; $y += 97) {
              $colors[$b.GetPixel($x, $y).ToArgb()] = $true
            }
          }
          Write-Host "画面に出ている色の種類: $($colors.Count)"
          if ($colors.Count -le 2) { Write-Host "::warning::画面が描画されていない可能性が高い" }
          $b.Dispose(); $img.Dispose()

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

      - name: Upload the screenshots (Windows)
        if: matrix.target == 'windows'
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: archival-packager-windows-screenshots
          path: screenshots/
          retention-days: 7

      # MSIX（Microsoft Store が扱う配布形式）に包む。
      #
      # Store に MSIX で出すと Microsoft が署名し直すので、こちらで証明書を
      # 買う必要がなくなる。ここで作るのは「包める形になっているか」の確認用で、
      # Identity は Partner Center の値ではないため、このままでは提出できない。
      - name: Package as MSIX (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $root = @(Get-ChildItem -Path build\windows -Filter "*.exe" -File)[0].DirectoryName
          $exe  = @(Get-ChildItem -Path build\windows -Filter "*.exe" -File)[0].Name
          $ver  = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value

          # MSIX の Version は 4 つ組で、末尾は 0 でなければならない。
          $manifestVersion = "$ver.0"

          Copy-Item -Recurse -Force packaging\windows\Assets -Destination (Join-Path $root "Assets")
          (Get-Content packaging\windows\AppxManifest.xml.in -Raw) `
            -replace '@EXE@', $exe -replace '@VERSION@', $manifestVersion |
            Set-Content -Path (Join-Path $root "AppxManifest.xml") -Encoding UTF8
          Write-Host "実行ファイル: $exe / バージョン: $manifestVersion"

          # MakeAppx は Windows SDK に入っている。SDK のバージョンは runner の
          # 更新で変わるので、決め打ちにせず一番新しいものを拾う。
          $makeappx = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "makeappx.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "MakeAppx.exe が見つかりません（Windows SDK 未導入）" }
          Write-Host "MakeAppx: $($makeappx.FullName)"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $makeappx.FullName pack /d $root /p dist\ArchivalPackager.msix /o
          if ($LASTEXITCODE -ne 0) { throw "MSIX の作成に失敗しました" }
          Get-Item dist\ArchivalPackager.msix | Format-List Name, Length

      - name: Upload the MSIX (Windows)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: archival-packager-windows-msix-unsigned
          path: dist/ArchivalPackager.msix
          retention-days: 7

      # 手元に Windows 機が無いので、成果物を持ち出せるようにしておく。
      # 署名は未対応（README 参照）なので、これは動作確認用であって配布物ではない。
      - name: Upload the build
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: archival-packager-windows-unsigned
          path: build/windows
          retention-days: 7
