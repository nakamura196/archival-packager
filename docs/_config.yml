# GitHub Pages（このフォルダを公開サイトとして配信する）の設定。
#
# **2026-09-12 にリポジトリ本体を公開した。** それまでは private で、
# docs/ だけが外から見える状態だった。いまはソースも公開されている。
#
# 改名するとリダイレクトされない。Pages の URL は掲載情報や審査で
# 参照されるので、リポジトリ名を変えるときは URL の差し替えも必ず行うこと
# （実際に 0.1.6 の審査が、切れた URL で差し戻された）。
#
# **2026-09-24 から独自ドメイン https://ap.ldas.jp で出している**（docs/CNAME）。
# DNS は Cloudflare の ldas.jp に CNAME ap → nakamura196.github.io（プロキシなし。
# プロキシを通すと GitHub が HTTPS の証明書を取れない）。
# 旧 URL（nakamura196.github.io/archival-packager/…）は GitHub が新 URL へ転送する。
# ストアの掲載情報とアプリ 0.1.8 以前は旧 URL を指しているので、CNAME を外すと
# その転送が止まって切れる。独自ドメインをやめるときは、先にそちらを差し替えること。
title: Archival Packager
description: デジタル資料から、OAIS の情報パッケージ（SIP / AIP）を作るアプリです（macOS・Windows）。
theme: jekyll-theme-minimal

# 共有したときに出る画像（OGP）。英語のページは front matter の image で ogp-en.png に差し替える。
# 画像は scripts/docs/make_ogp.py で作る。
guide_theme:
  image: /assets/ogp/ogp-ja.png

# ページの型。トップ・ガイド・画面マニュアルに加え、技術ページも guide-theme で出す
# （2026-09-24）。各ページの front matter で上書きできる。
defaults:
  - scope: { path: "" }
    values:
      layout: guide
      lang: ja
      footer: "お問い合わせ / Contact: nakamura@hi.u-tokyo.ac.jp"
      nav:
        - { title: トップ, url: ./ }
        - { title: はじめての方へ, url: guide/ }
        - { title: 画面の使い方, url: manual/ }
        - { title: 詳しい使い方, url: usage.html }
        - { title: GitHub, url: "https://github.com/nakamura196/archival-packager" }
