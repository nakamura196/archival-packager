# GitHub Pages（このフォルダを公開サイトとして配信する）の設定。
#
# **2026-09-12 にリポジトリ本体を公開した。** それまでは private で、
# docs/ だけが外から見える状態だった。いまはソースも公開されている。
#
# 改名するとリダイレクトされない。Pages の URL は掲載情報や審査で
# 参照されるので、リポジトリ名を変えるときは URL の差し替えも必ず行うこと
# （実際に 0.1.6 の審査が、切れた URL で差し戻された）。
title: Archival Packager
description: Builds OAIS information packages (SIP / AIP) — macOS and Windows
theme: jekyll-theme-minimal

# ページの型。トップ・ガイド・画面マニュアルに加え、技術ページも guide-theme で出す
# （2026-09-24）。各ページの front matter で上書きできる。
defaults:
  - scope: { path: "" }
    values:
      layout: guide
      lang: ja
      footer: "お問い合わせ / Contact: nakamura@hi.u-tokyo.ac.jp"
      nav:
        - { title: トップ, url: ./ }
        - { title: はじめての方へ, url: guide/ }
        - { title: 画面の使い方, url: manual/ }
        - { title: 詳しい使い方, url: usage.html }
        - { title: GitHub, url: "https://github.com/nakamura196/archival-packager" }
